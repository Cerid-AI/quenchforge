name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  # The hardware gate also runs for the merge queue, so a PR that went stale
  # behind another merge is re-verified against the code that actually lands.
  merge_group:

# Cancel superseded runs on the same branch (saves CI minutes when several
# pushes land back-to-back). Canonical form per global GH Actions cost policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin to whatever version setup-go installed; don't let the toolchain
  # auto-upgrade itself mid-build (which would risk go.mod drift across
  # runners and obscure version-dependent failures).
  GOTOOLCHAIN: local

jobs:
  # ------------------------------------------------------------------
  # Lint — go vet + gofmt + go mod tidy drift gate
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: gofmt -l (fail on unformatted files)
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files found:"
            echo "$unformatted"
            echo
            gofmt -d cmd internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: release artifacts are all notarized
        run: bash scripts/check-release-artifacts.sh

      # NB: no `go mod tidy` drift gate yet. The MVP is stdlib-only so
      # there's nothing for tidy to manage; we'll add the gate when Olla
      # is vendored in v0.2 (or earlier when we pull in a real dep).

  # ------------------------------------------------------------------
  # Test — go test ./... on Linux (CPU-stub paths, no GPU work).
  # ------------------------------------------------------------------
  test-linux:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./... -race -timeout 5m -count=1

  # ------------------------------------------------------------------
  # Test — go test ./... on macOS arm64. Validates the darwin build
  # tags compile clean and the macOS-only paths exercise their stubs.
  # ------------------------------------------------------------------
  test-macos:
    needs: [lint]
    # macos runners cost 10× ubuntu — skip on dependabot PRs unless explicitly
    # labelled `dependabot-full-ci`. Per global GH Actions cost policy (Rule 6).
    if: >-
      github.actor != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./... -race -timeout 5m -count=1
      - name: prestart guard leaves foreign listeners alone
        run: bash tests/prestart_guard_test.sh

  # ------------------------------------------------------------------
  # Build matrix — make sure both target triples produce a binary.
  # We don't run them, just verify they link.
  # ------------------------------------------------------------------
  build-matrix:
    needs: [lint]
    # macos build matrix — gate on dependabot per Rule 6.
    if: >-
      github.actor != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: build (darwin/${{ matrix.goarch }})
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o /tmp/quenchforge-${{ matrix.goarch }} ./cmd/quenchforge
          go build -o /tmp/quenchforge-preflight-${{ matrix.goarch }} ./cmd/quenchforge-preflight
          file /tmp/quenchforge-${{ matrix.goarch }}
          file /tmp/quenchforge-preflight-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin-${{ matrix.goarch }}
          path: |
            /tmp/quenchforge-${{ matrix.goarch }}
            /tmp/quenchforge-preflight-${{ matrix.goarch }}
          retention-days: 7

  # ------------------------------------------------------------------
  # AMD-GPU integration tests — runs on the self-hosted runner labelled
  # `amd-gpu` (currently mac-pro-2019-vega-ii). Spawns the patched
  # llama-server against the real Vega II, exercises
  # /v1/chat/completions through the gateway, asserts the output isn't
  # garbage tokens. See docs/SELF_HOSTED_RUNNER.md.
  #
  # This is the gate CLAUDE.md absolute rule 5 describes, so it fails the
  # run. It used to carry `continue-on-error: true`, which made the only
  # test that distinguishes correct Metal output from the garbage-token
  # signature the project exists to prevent purely advisory.
  #
  # When the runner is offline the job fails and the PR waits — that is the
  # intended trade for a hardware gate on a single machine. The escape
  # hatch is the maintainer re-running or temporarily dropping the required
  # check in branch protection, not a workflow that cannot fail.
  #
  # rebase-upstream.yml has no test step of its own: it opens a PR labelled
  # `needs-hw-verify`, and that PR is gated by this job like any other.
  # ------------------------------------------------------------------
  amd-gpu-integration:
    needs: [lint]
    # Fork PRs MUST NOT trigger self-hosted runs (Rule 8). Also skip on
    # dependabot PRs unless `dependabot-full-ci` labelled (Rule 6).
    if: >-
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.actor != 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'dependabot-full-ci'))
    runs-on: [self-hosted, amd-gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The runner is a persistent launchd service and actions/checkout does
      # not clean submodule working trees, so the binary from the first-ever
      # run survives every later run. Keying the rebuild on "does a binary
      # exist" meant a changed patch series was never re-applied and the gate
      # tested the previous build. Key it on the inputs instead: the patch
      # series plus the scripts that apply and build it.
      - name: build patched llama-server (when the patch series changes)
        run: |
          set -euo pipefail
          stamp=llama.cpp/.quenchforge-build-stamp
          want="$(cat $(find patches -name '*.patch' -not -path '*/drafts/*' | sort)                       scripts/apply-patches.sh scripts/build-llama.sh |
                  shasum -a 256 | awk '{print $1}')"
          have="$(cat "$stamp" 2>/dev/null || echo none)"
          bin=""
          for candidate in llama.cpp/build-x86_64/bin/llama-server llama.cpp/build-arm64/bin/llama-server; do
            [ -x "$candidate" ] && bin="$candidate"
          done
          if [ -n "$bin" ] && [ "$want" = "$have" ]; then
            echo "llama-server is current for patch series $want ($bin)"
            exit 0
          fi
          echo "rebuilding llama-server: patch series $want (stamp: $have)"
          rm -f "$stamp"
          bash scripts/apply-patches.sh --reset
          bash scripts/apply-patches.sh
          bash scripts/build-llama.sh
          echo "$want" > "$stamp"

      # No TEST_MODEL_PATH fallback here: the harness fails when no model is
      # present rather than skipping, so a wiped model cache cannot turn the
      # correctness assertion into a green run that proves nothing.
      - name: integration test (amd_gpu tag)
        run: go test -tags=amd_gpu -timeout 10m -count=1 ./tests/integration/...
